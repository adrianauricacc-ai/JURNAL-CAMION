<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Jurnal Camion</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: white;
    background:
        linear-gradient(rgba(0,0,0,.78), rgba(0,0,0,.92)),
        url("https://images.unsplash.com/photo-1519003722824-194d4455a60c?auto=format&fit=crop&w=1200&q=80")
        center/cover fixed;
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 500px;
    margin: auto;
    padding: 18px;
}

.header {
    text-align: center;
    margin-bottom: 20px;
}

.header h1 {
    margin: 0;
    font-size: 28px;
}

.header p {
    color: #aaa;
    margin-top: 6px;
}

.card {
    background: rgba(20,20,20,.90);
    border: 1px solid #333;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 15px;
    box-shadow: 0 8px 25px rgba(0,0,0,.4);
}

.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.stat {
    background: #111;
    border-radius: 14px;
    padding: 15px;
    text-align: center;
}

.stat .number {
    font-size: 25px;
    font-weight: bold;
}

.stat .label {
    color: #999;
    font-size: 13px;
    margin-top: 5px;
}

h2 {
    font-size: 19px;
    margin-top: 0;
}

label {
    display: block;
    color: #aaa;
    font-size: 14px;
    margin: 12px 0 6px;
}

input {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #444;
    background: #111;
    color: white;
    font-size: 17px;
    outline: none;
}

input:focus {
    border-color: #fff;
}

button {
    width: 100%;
    border: 0;
    border-radius: 13px;
    padding: 16px;
    margin-top: 14px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.start {
    background: #18a558;
    color: white;
}

.stop {
    background: #d93636;
    color: white;
}

.secondary {
    background: #292929;
    color: white;
}

button:active {
    transform: scale(.98);
}

.active {
    border: 1px solid #18a558;
}

.active-text {
    color: #18a558;
    font-weight: bold;
}

.hidden {
    display: none;
}

.trip {
    background: #111;
    border-radius: 13px;
    padding: 14px;
    margin-top: 10px;
    border-left: 4px solid #555;
}

.trip strong {
    font-size: 18px;
}

.trip small {
    color: #999;
}

.km {
    font-size: 22px;
    font-weight: bold;
    margin-top: 5px;
}

.empty {
    color: #777;
    text-align: center;
    padding: 15px;
}

.footer {
    text-align: center;
    color: #666;
    font-size: 12px;
    padding: 10px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🚛 JURNAL CAMION</h1>
        <p>Evidența curselor și kilometrilor</p>
    </div>

    <div class="card">
        <div class="stats">
            <div class="stat">
                <div class="number" id="monthlyKm">0</div>
                <div class="label">KM LUNA ACEASTA</div>
            </div>

            <div class="stat">
                <div class="number" id="monthlyTrips">0</div>
                <div class="label">CURSE</div>
            </div>
        </div>
    </div>

    <div class="card" id="activeCard">

        <h2>▶️ Cursa actuală</h2>

        <div id="noActive">
            <label>Kilometraj START</label>
            <input
                type="number"
                id="startKm"
                placeholder="Ex: 458720"
                inputmode="numeric"
            >

            <label>Număr remorcă</label>
            <input
                type="text"
                id="startTrailer"
                placeholder="Ex: R5837BCL"
            >

            <button class="start" onclick="startTrip()">
                🚛 START CURSĂ
            </button>
        </div>

        <div id="activeTrip" class="hidden">

            <p class="active-text">🟢 CURSA ESTE ACTIVĂ</p>

            <p>
                Kilometri START:
                <strong id="displayStartKm"></strong>
            </p>

            <p>
                Remorcă:
                <strong id="displayTrailer"></strong>
            </p>

            <label>Kilometraj STOP</label>

            <input
                type="number"
                id="stopKm"
                placeholder="Ex: 460120"
                inputmode="numeric"
            >

            <button class="stop" onclick="stopTrip()">
                🛑 STOP CURSĂ
            </button>

        </div>

    </div>

    <div class="card">

        <h2>📋 Istoric curse</h2>

        <div id="history"></div>

        <button class="secondary" onclick="clearHistory()">
            🗑️ Șterge istoricul
        </button>

    </div>

    <div class="footer">
        Jurnal Camion • versiunea 1.0
    </div>

</div>

<script>

const tg = window.Telegram && window.Telegram.WebApp;

if (tg) {
    tg.ready();
    tg.expand();
}

let trips = JSON.parse(localStorage.getItem("truckTrips") || "[]");

let activeTrip = JSON.parse(
    localStorage.getItem("activeTruckTrip") || "null"
);

function saveData() {

    localStorage.setItem(
        "truckTrips",
        JSON.stringify(trips)
    );

    localStorage.setItem(
        "activeTruckTrip",
        JSON.stringify(activeTrip)
    );
}

function startTrip() {

    const km = Number(
        document.getElementById("startKm").value
    );

    const trailer = document
        .getElementById("startTrailer")
        .value
        .trim();

    if (!km) {
        alert("Introdu kilometrajul de START.");
        return;
    }

    if (!trailer) {
        alert("Introdu numărul remorcii.");
        return;
    }

    if (activeTrip) {
        alert("Ai deja o cursă activă.");
        return;
    }

    activeTrip = {
        startKm: km,
        trailer: trailer,
        startDate: new Date().toISOString()
    };

    saveData();

    document.getElementById("startKm").value = "";
    document.getElementById("startTrailer").value = "";

    render();
}

function stopTrip() {

    if (!activeTrip) {
        alert("Nu există o cursă activă.");
        return;
    }

    const stopKm = Number(
        document.getElementById("stopKm").value
    );

    if (!stopKm) {
        alert("Introdu kilometrajul de STOP.");
        return;
    }

    if (stopKm < activeTrip.startKm) {
        alert("Kilometrajul STOP nu poate fi mai mic decât START.");
        return;
    }

    const km = stopKm - activeTrip.startKm;

    const trip = {
        startKm: activeTrip.startKm,
        stopKm: stopKm,
        km: km,
        trailer: activeTrip.trailer,
        startDate: activeTrip.startDate,
        endDate: new Date().toISOString()
    };

    trips.unshift(trip);

    activeTrip = null;

    saveData();

    document.getElementById("stopKm").value = "";

    alert("Cursa a fost salvată: " + km + " km");

    render();
}

function getCurrentMonthTrips() {

    const now = new Date();

    return trips.filter(trip => {

        const date = new Date(trip.endDate);

        return (
            date.getMonth() === now.getMonth() &&
            date.getFullYear() === now.getFullYear()
        );

    });
}

function renderStats() {

    const monthTrips = getCurrentMonthTrips();

    const totalKm = monthTrips.reduce(
        (sum, trip) => sum + trip.km,
        0
    );

    document.getElementById("monthlyKm").textContent =
        totalKm.toLocaleString("ro-RO");

    document.getElementById("monthlyTrips").textContent =
        monthTrips.length;
}

function renderActive() {

    const noActive =
        document.getElementById("noActive");

    const active =
        document.getElementById("activeTrip");

    if (activeTrip) {

        noActive.classList.add("hidden");
        active.classList.remove("hidden");

        document.getElementById("displayStartKm")
            .textContent =
            activeTrip.startKm.toLocaleString("ro-RO");

        document.getElementById("displayTrailer")
            .textContent =
            activeTrip.trailer;

    } else {

        noActive.classList.remove("hidden");
        active.classList.add("hidden");

    }
}

function renderHistory() {

    const container =
        document.getElementById("history");

    if (trips.length === 0) {

        container.innerHTML =
            '<div class="empty">Nu există curse salvate.</div>';

        return;
    }

    container.innerHTML = trips.map((trip, index) => {

        const date =
            new Date(trip.endDate);

        const formattedDate =
            date.toLocaleDateString("ro-RO");

        return `
            <div class="trip">

                <strong>🚛 ${trip.km.toLocaleString("ro-RO")} km</strong>

                <div>
                    Remorcă:
                    <strong>${escapeHtml(trip.trailer)}</strong>
                </div>

                <div>
                    ${trip.startKm.toLocaleString("ro-RO")}
                    →
                    ${trip.stopKm.toLocaleString("ro-RO")}
                </div>

                <small>
                    ${formattedDate}
                </small>

            </div>
        `;

    }).join("");

}

function escapeHtml(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

function clearHistory() {

    if (!trips.length) {
        return;
    }

    const confirmDelete =
        confirm(
            "Sigur vrei să ștergi tot istoricul?"
        );

    if (!confirmDelete) {
        return;
    }

    trips = [];

    saveData();

    render();
}

function render() {

    renderStats();
    renderActive();
    renderHistory();

}

render();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Jurnal Camion</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: #fff;
    min-height: 100vh;

    background:
        linear-gradient(rgba(0,0,0,.76), rgba(0,0,0,.94)),
        url("https://images.unsplash.com/photo-1601584115197-04ecc0da31d8?auto=format&fit=crop&w=1400&q=85")
        center center / cover fixed no-repeat;
}

.container {
    max-width: 520px;
    margin: auto;
    padding: 18px;
}

.header {
    text-align: center;
    padding: 10px 0 20px;
}

.header h1 {
    margin: 0;
    font-size: 29px;
    font-weight: 800;
}

.header p {
    color: #aaa;
    margin: 7px 0 0;
}

.card {
    background: rgba(15,15,15,.91);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 15px;
    box-shadow: 0 8px 30px rgba(0,0,0,.45);
}

.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.stat {
    background: rgba(0,0,0,.55);
    border-radius: 15px;
    padding: 15px 10px;
    text-align: center;
}

.number {
    font-size: 25px;
    font-weight: bold;
}

.label {
    color: #999;
    font-size: 12px;
    margin-top: 5px;
}

h2 {
    margin: 0 0 14px;
    font-size: 19px;
}

label {
    display: block;
    color: #aaa;
    font-size: 14px;
    margin: 13px 0 6px;
}

input {
    width: 100%;
    padding: 15px;
    border-radius: 13px;
    border: 1px solid #444;
    background: #101010;
    color: white;
    font-size: 17px;
    outline: none;
}

input:focus {
    border-color: #fff;
}

button {
    width: 100%;
    padding: 16px;
    margin-top: 15px;
    border: 0;
    border-radius: 13px;
    font-size: 17px;
    font-weight: bold;
}

.start {
    background: #18a558;
    color: white;
}

.stop {
    background: #d93636;
    color: white;
}

.secondary {
    background: #292929;
    color: white;
}

.active {
    color: #22c55e;
    font-weight: bold;
}

.hidden {
    display: none;
}

.trip {
    background: #101010;
    border-radius: 14px;
    padding: 15px;
    margin-top: 10px;
    border-left: 4px solid #555;
}

.route {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 7px;
}

.trip-info {
    color: #aaa;
    line-height: 1.6;
}

.trip-km {
    font-size: 22px;
    font-weight: bold;
    margin-top: 6px;
}

.empty {
    text-align: center;
    color: #777;
    padding: 15px 0;
}

.footer {
    text-align: center;
    color: #666;
    font-size: 12px;
    padding: 8px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🚛 JURNAL CAMION</h1>
        <p>Evidența curselor tale</p>
    </div>

    <!-- STATISTICI -->
    <div class="card">

        <div class="stats">

            <div class="stat">
                <div class="number" id="monthlyKm">0</div>
                <div class="label">KM LUNA ACEASTA</div>
            </div>

            <div class="stat">
                <div class="number" id="monthlyTrips">0</div>
                <div class="label">CURSE</div>
            </div>

        </div>

    </div>

    <!-- START CURSA -->
    <div class="card">

        <h2>▶️ START CURSĂ</h2>

        <div id="startForm">

            <label>📍 De unde plec?</label>

            <input
                type="text"
                id="departure"
                placeholder="Ex: Zaragoza, Spania"
            >

            <label>🔢 Kilometraj START</label>

            <input
                type="number"
                id="startKm"
                placeholder="Ex: 458720"
                inputmode="numeric"
            >

            <label>🚛 Număr remorcă</label>

            <input
                type="text"
                id="startTrailer"
                placeholder="Ex: R5837BCL"
            >

            <button class="start" onclick="startTrip()">
                🚛 START CURSĂ
            </button>

        </div>

        <div id="activeForm" class="hidden">

            <p class="active">🟢 CURSA ESTE ACTIVĂ</p>

            <p>
                📍 Plecare:
                <strong id="activeDeparture"></strong>
            </p>

            <p>
                🔢 KM START:
                <strong id="activeStartKm"></strong>
            </p>

            <p>
                🚛 Remorcă:
                <strong id="activeTrailer"></strong>
            </p>

        </div>

    </div>

    <!-- STOP CURSA -->
    <div class="card" id="stopCard">

        <h2>🛑 STOP CURSĂ</h2>

        <div id="stopForm" class="hidden">

            <label>📍 Unde ajung?</label>

            <input
                type="text"
                id="destination"
                placeholder="Ex: Barcelona, Spania"
            >

            <label>🔢 Kilometraj STOP</label>

            <input
                type="number"
                id="stopKm"
                placeholder="Ex: 460120"
                inputmode="numeric"
            >

            <button class="stop" onclick="stopTrip()">
                🛑 FINALIZEAZĂ CURSA
            </button>

        </div>

        <div id="noTrip">

            <p style="color:#777;text-align:center;">
                Nu există nicio cursă activă.
            </p>

        </div>

    </div>

    <!-- ISTORIC -->
    <div class="card">

        <h2>📋 ISTORIC CURSE</h2>

        <div id="history"></div>

        <button class="secondary" onclick="clearHistory()">
            🗑️ ȘTERGE ISTORICUL
        </button>

    </div>

    <div class="footer">
        Jurnal Camion • 🚛
    </div>

</div>

<script>

const tg = window.Telegram?.WebApp;

if (tg) {
    tg.ready();
    tg.expand();
}

let trips = JSON.parse(
    localStorage.getItem("truckTrips") || "[]"
);

let activeTrip = JSON.parse(
    localStorage.getItem("activeTruckTrip") || "null"
);


function saveData() {

    localStorage.setItem(
        "truckTrips",
        JSON.stringify(trips)
    );

    localStorage.setItem(
        "activeTruckTrip",
        JSON.stringify(activeTrip)
    );
}


function startTrip() {

    const departure =
        document.getElementById("departure").value.trim();

    const startKm =
        Number(document.getElementById("startKm").value);

    const trailer =
        document.getElementById("startTrailer").value.trim();


    if (!departure) {
        alert("Introdu locul de plecare.");
        return;
    }

    if (!startKm) {
        alert("Introdu kilometrajul de START.");
        return;
    }

    if (!trailer) {
        alert("Introdu numărul remorcii.");
        return;
    }

    if (activeTrip) {
        alert("Ai deja o cursă activă.");
        return;
    }


    activeTrip = {

        departure: departure,

        startKm: startKm,

        trailer: trailer,

        startDate: new Date().toISOString()

    };


    saveData();

    document.getElementById("departure").value = "";
    document.getElementById("startKm").value = "";
    document.getElementById("startTrailer").value = "";

    render();
}


function stopTrip() {

    if (!activeTrip) {
        alert("Nu există o cursă activă.");
        return;
    }


    const destination =
        document.getElementById("destination").value.trim();

    const stopKm =
        Number(document.getElementById("stopKm").value);


    if (!destination) {
        alert("Introdu locul unde ai ajuns.");
        return;
    }

    if (!stopKm) {
        alert("Introdu kilometrajul de STOP.");
        return;
    }

    if (stopKm < activeTrip.startKm) {
        alert(
            "Kilometrajul STOP nu poate fi mai mic decât START."
        );
        return;
    }


    const trip = {

        departure: activeTrip.departure,

        destination: destination,

        startKm: activeTrip.startKm,

        stopKm: stopKm,

        km: stopKm - activeTrip.startKm,

        trailer: activeTrip.trailer,

        startDate: activeTrip.startDate,

        endDate: new Date().toISOString()

    };


    trips.unshift(trip);

    activeTrip = null;

    saveData();

    document.getElementById("destination").value = "";
    document.getElementById("stopKm").value = "";


    alert(
        "Cursa a fost salvată: " +
        trip.km.toLocaleString("ro-RO") +
        " km"
    );


    render();
}


function currentMonthTrips() {

    const now = new Date();

    return trips.filter(trip => {

        const date = new Date(trip.endDate);

        return (
            date.getMonth() === now.getMonth() &&
            date.getFullYear() === now.getFullYear()
        );

    });

}


function renderStats() {

    const monthTrips =
        currentMonthTrips();

    const totalKm =
        monthTrips.reduce(
            (sum, trip) => sum + trip.km,
            0
        );


    document.getElementById("monthlyKm").textContent =
        totalKm.toLocaleString("ro-RO");

    document.getElementById("monthlyTrips").textContent =
        monthTrips.length;

}


function renderActive() {

    const startForm =
        document.getElementById("startForm");

    const activeForm =
        document.getElementById("activeForm");

    const stopForm =
        document.getElementById("stopForm");

    const noTrip =
        document.getElementById("noTrip");


    if (activeTrip) {

        startForm.classList.add("hidden");

        activeForm.classList.remove("hidden");

        stopForm.classList.remove("hidden");

        noTrip.classList.add("hidden");


        document.getElementById(
            "activeDeparture"
        ).textContent =
            activeTrip.departure;


        document.getElementById(
            "activeStartKm"
        ).textContent =
            activeTrip.startKm.toLocaleString("ro-RO");


        document.getElementById(
            "activeTrailer"
        ).textContent =
            activeTrip.trailer;

    } else {

        startForm.classList.remove("hidden");

        activeForm.classList.add("hidden");

        stopForm.classList.add("hidden");

        noTrip.classList.remove("hidden");

    }

}


function renderHistory() {

    const container =
        document.getElementById("history");


    if (trips.length === 0) {

        container.innerHTML =
            '<div class="empty">Nu există curse salvate.</div>';

        return;
    }


    container.innerHTML =
        trips.map(trip => {

            const date =
                new Date(trip.endDate);

            const formattedDate =
                date.toLocaleDateString("ro-RO");


            return `

                <div class="trip">

                    <div class="route">
                        📍 ${escapeHtml(trip.departure)}
                        →
                        ${escapeHtml(trip.destination)}
                    </div>

                    <div class="trip-info">

                        🚛 Remorcă:
                        <strong>
                            ${escapeHtml(trip.trailer)}
                        </strong>

                        <br>

                        🔢
                        ${trip.startKm.toLocaleString("ro-RO")}
                        →
                        ${trip.stopKm.toLocaleString("ro-RO")}

                        <br>

                        📅 ${formattedDate}

                    </div>

                    <div class="trip-km">
                        ${trip.km.toLocaleString("ro-RO")} km
                    </div>

                </div>

            `;

        }).join("");

}


function escapeHtml(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function clearHistory() {

    if (trips.length === 0) {
        return;
    }


    if (
        !confirm(
            "Sigur vrei să ștergi tot istoricul?"
        )
    ) {
        return;
    }


    trips = [];

    saveData();

    render();

}


function render() {

    renderStats();

    renderActive();

    renderHistory();

}


render();

</script>

</body>
</html>
